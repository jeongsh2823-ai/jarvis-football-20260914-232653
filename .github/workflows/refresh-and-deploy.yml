name: Refresh football data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jarvis-football-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect public football feeds
        run: node scripts/collect.mjs
        env:
          STRICT_DATA: '1'
      - name: Verify data and time conversion
        run: node --test tests/*.test.mjs
      - name: Save verified data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data dist/assets/crests
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified football data"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
